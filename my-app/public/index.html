<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dandiya Night Image Rotation</title>
  <style>
    body {
      text-align: center;
      margin-top: 50px;
      background-image: url('https://example.com/dandiya-night-bg.jpg'); /* apna background image link yahan do */
      background-size: cover;
      background-position: center;
      height: 100vh;
    }
    h1 {
      background-color: black;
      color: white;
      display: inline-block;
      padding: 10px 20px;
    }
    img {
      height: 400px;
      width: 400px;
      transition: transform 0.5s ease;
      border-radius: 10px;
      box-shadow: 0 0 20px gold;
    }
    button {
      margin: 20px 10px;
      padding: 10px 20px;
      background-color: orange;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Image Rotation</h1>
  <br>
  <img id="myImage" src="C:\Users\vai93\OneDrive\Desktop\FSD cse-29\image2.jpg" alt="Rotating Image">
  <br>
  <button onclick="rotateLeft()">⬅ Rotate Left</button>
  <button onclick="rotateRight()">Rotate Right ➡</button>

  <script>
    let rotation = 0;

    function rotateLeft() {
      rotation -= 90; // anticlockwise
      document.getElementById("myImage").style.transform = `rotate(${rotation}deg)`;
    }

    function rotateRight() {
      rotation += 90; // clockwise
      document.getElementById("myImage").style.transform = `rotate(${rotation}deg)`;
    }
  </script>
</body>
</html>
